
kind: pipeline
name: node22

steps:
- name: install
  image: node:22
  commands:
  - npm install

- name: build
  image: node:22
  commands:
  - make build

- name: test
  image: node:22
  commands:
  - make test.ci

- name: codecov
  image: node:22
  environment:
    CODECOV_TOKEN:
      from_secret: CODECOV_TOKEN
  commands:
  - make upload.codecov
